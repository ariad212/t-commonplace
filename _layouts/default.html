<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">the commonplace<span class="period">.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/#journal' | relative_url }}">Journal</a>
      <a href="{{ '/#portfolio' | relative_url }}">Portfolio</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="mailto:hello@example.com">Contact ↗</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer wrap"><span>© {{ 'now' | date: '%Y' }} The Commonplace</span><span>Made slowly, with intention. ✳</span></footer>
</body>
</html>
