---
layout: default
---
<article class="article wrap">
  <a class="eyebrow" href="{{ '/#journal' | relative_url }}">← Back to journal</a>
  <p class="eyebrow">{{ page.category | default: 'Journal' }} · {{ page.date | date: '%d %B %Y' }}</p>
  <h1>{{ page.title }}</h1>
  <div class="article-content">{{ content }}</div>
  <a class="text-link" href="{{ '/#journal' | relative_url }}">More from the journal ↗</a>
</article>
